services:
  # --- Homebridge (HomeKit-silta muille kuin natiiveille HomeKit-laitteille) ---
  # Home Assistantia ei koskaan otettu tuotantoon tällä Pi:llä (jätettiin
  # tarkoituksella palauttamatta) - Homebridge korvaa sen tässä, kevyempänä
  # ratkaisuna kun tavoite on saada laitteet Apple Home -sovellukseen.
  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: unless-stopped
    network_mode: host    # Pakollinen: HomeKit-pariliitos/löytäminen perustuu
                           # mDNS/Bonjour-lähetyksiin, jotka eivät kulje Dockerin
                           # oman bridge-verkon läpi (sama syy kuin Home Assistantilla).
    volumes:
      - ./homebridge:/homebridge
    environment:
      - TZ=Europe/Helsinki
      - ENABLE_AVAHI=1

  # --- Vedonlyöntidashboard (Streamlit) ---
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: cs-dashboard
    volumes:
      # Yksi jaettu kansio kannoille - sekä dashboard että scraper kirjoittavat/lukevat
      # SAMOJA tiedostoja tämän kautta. entrypoint.sh linkittää ne oikeille nimille.
      - ./data:/app/db_data
    ports:
      - "8501:8501"
    restart: unless-stopped

  # --- FlareSolverr: ratkaisee HLTV:n Cloudflare-suojauksen (Managed Challenge /
  # Turnstile) scraperin puolesta. Aktiivisesti ylläpidetty, tarkoitettu juuri
  # tähän käyttötarkoitukseen - paljon kestävämpi ratkaisu kuin käsin patchattu
  # Selenium/chromedriver, jota kokeiltiin ensin eikä saatu läpäisemään HLTV:n
  # /stats/-sivujen suojausta (ks. WebScrape.py:n git-historia). Sama
  # profiles-rivi kuin scraperilla, koska tätä ei tarvita muulloin kuin
  # scraperin ajon aikana - ei jää turhaan syömään RAM:ia Pi:llä loppupäiväksi
  # (systemd-palvelu pysäyttää tämän ajon jälkeen, ks. systemd/cs-scraper.service).
  # Portti 8191 julkaistu vain paikallista vianmääritystä varten
  # (esim. curl http://localhost:8191/ Pi:llä) - scraper puhuu sille joka
  # tapauksessa suoraan Dockerin sisäisen verkon kautta.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Helsinki
    ports:
      - "8191:8191"
    profiles: ["scraper"]
    restart: "no"

  # --- HLTV-skraperi ---
  # HUOM: EI restart-käytäntöä eikä käynnisty "docker compose up":lla, koska se on
  # tarkoitettu ajettavaksi KERRAN PÄIVÄSSÄ systemd-ajastimen kautta (ks. systemd/),
  # ei taustalla pyörivänä palveluna. profiles-rivi estää sen käynnistymisen vahingossa
  # "docker compose up -d" -komennolla; "docker compose run --rm scraper" toimii silti,
  # koska se nimeää palvelun eksplisiittisesti.
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: cs-scraper
    volumes:
      - ./data:/app/db_data
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    depends_on:
      - flaresolverr
    profiles: ["scraper"]
