{% extends "base.html" %}
{% block content %}
<div class="page-h"><h1>Tilastot</h1></div>
<form id="sf" class="filters" onsubmit="return false">
  <div class="seg" role="radiogroup" aria-label="Aikaväli">
    {% for key, lab in ranges %}<input type="radio" name="range" id="r-{{ key }}" value="{{ key }}" {{ 'checked' if key == range_key }}><label for="r-{{ key }}">{{ lab }}</label>{% endfor %}
  </div>
  <select name="tournament" aria-label="Turnaus">
    <option value="all">Kaikki turnaukset</option>
    {% for t in tournament_names %}<option {{ 'selected' if t == tournament }}>{{ t }}</option>{% endfor %}
  </select>
  <div class="seg" id="stats-tabs">
    <button type="button" class="{{ 'on' if tab == 'overview' }}" data-tab="overview">Yleiskuva</button>
    <button type="button" class="{{ 'on' if tab == 'model' }}" data-tab="model">Malli</button>
    <button type="button" class="{{ 'on' if tab == 'players' }}" data-tab="players">Pelaajat</button>
  </div>
</form>
<div id="stats-content" class="stack" hx-get="/stats/{{ tab }}" hx-include="#sf" hx-trigger="load, change from:#sf, refresh" hx-swap="innerHTML"></div>
{% endblock %}
