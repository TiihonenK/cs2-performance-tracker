{% for m in matches %}
<button type="button" class="pin-item" data-match='{{ m | tojson_attr }}'>
  <b>{{ m.t1 }} vs {{ m.t2 }}</b>
  <small>{% if m.map_list %}Kartat {{ m.map_list }}{% if m.has_total %} · kierrostotalit{% endif %}{% else %}Ei karttakertoimia{% endif %}</small>
  {% if m.missing %}<small style="color:var(--warn)">Ei kannassa: {{ m.missing | join(', ') }} (valitse käsin)</small>{% endif %}
</button>
{% endfor %}
